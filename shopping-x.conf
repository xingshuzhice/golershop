upstream shopping_api {
    server 127.0.0.1:3005;
    keepalive 64;
}

server { #listening port
    server_name  api.xingshuzhice.com; #Your domain server_name
    client_max_body_size 20M; # 允许大文件上传（商品图片等）

    listen 80;
    server_name 123.123.123.123;  # 替换为你的IP地址

    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_comp_level 2;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/x-httpd-php image/jpeg image/gif image/png application/wasm;
    gzip_vary off;
    gzip_disable "MSIE [1-6]\.";

    default_type application/wasm;

    location /klines {
        proxy_pass http://127.0.0.1:8000/klines;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_redirect off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_set_header X-NginX-Proxy true;

        # WebSocket支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_http_version 1.1;
        proxy_cache_bypass $http_upgrade;

        # 增加超时时间以支持长连接
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        proxy_pass http://shopping_api;
    }

    # ==================== 页面路由配置 ====================
    
    # 管理后台静态页面
    location /admin/ {
        # IP白名单限制（管理后台只允许内网访问）
        allow 192.168.1.0/24;
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny all;
        
        alias /var/www/admin/;  # 管理后台静态文件目录
        index index.html;
        try_files $uri $uri/ /admin/index.html;
        
        # 管理后台静态资源缓存
        location ~* \.(js|css|html)$ {
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
        }
    }

    # H5移动端页面
    location /h5/ {
        alias /var/www/h5/;  # H5移动端静态文件目录
        index index.html;
        try_files $uri $uri/ /h5/index.html;
        
        # H5页面缓存设置
        location ~* \.(js|css|html)$ {
            expires 1h;
            add_header Cache-Control "public";
        }
        
        # H5页面特有的移动端优化
        add_header Vary "User-Agent";
    }

    # PC端主商城页面
    location / {
        root /var/www/pc; # PC端前端构建文件目录
        index index.html;
        try_files $uri $uri/ /index.html;
        
        # PC端静态文件缓存设置
        location ~* \.(js|css|html)$ {
            expires 1h;
            add_header Cache-Control "public";
        }
    }

    # 移动设备自动重定向到H5页面
    location @mobile_redirect {
        if ($http_user_agent ~* "(android|bb\d+|meego).+mobile|avantgo|bada\/|blackberry|blazer|compal|elaine|fennec|hiptop|iemobile|ip(hone|od)|iris|kindle|lge |maemo|midp|mmp|mobile.+firefox|netfront|opera m(ob|in)i|palm( os)?|phone|p(ixi|re)\/|plucker|pocket|psp|series(4|6)0|symbian|treo|up\.(browser|link)|vodafone|wap|windows ce|xda|xiino") {
            return 302 /h5$request_uri;
        }
    }

    # 健康检查端点
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # 禁止访问敏感文件
    location ~ /\.(ht|git|svn) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /\.env {
        deny all;
        return 404;
    }


    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.xingshuzhice.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.xingshuzhice.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# H5移动端专用子域名（可选）
server {
    server_name m.your-domain.com; # H5移动端专用域名
    
    # 移动端专用优化
    client_max_body_size 10M; # 移动端上传限制稍小
    
    # 安全头设置
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    
    # H5移动端页面
    location / {
        root /var/www/h5; # H5移动端静态文件目录
        index index.html;
        try_files $uri $uri/ /index.html;
        
        # 移动端优化缓存策略
        location ~* \.(js|css)$ {
            expires 1h;
            add_header Cache-Control "public";
        }
        
        location ~* \.(jpg|jpeg|png|gif|ico)$ {
            expires 7d;
            add_header Cache-Control "public";
        }
    }
    
    # H5端API代理（与主站相同）
    location /api/ {
        proxy_pass http://shopping_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
}

# 管理后台专用子域名（可选，更安全）
server {
    server_name admin.your-domain.com; # 管理后台专用域名
    
    # 严格的安全限制
    allow 192.168.1.0/24;
    allow 10.0.0.0/8;
    allow 127.0.0.1;
    deny all;
    
    # 管理后台页面
    location / {
        root /var/www/admin; # 管理后台静态文件目录
        index index.html;
        try_files $uri $uri/ /index.html;
        
        # 管理后台缓存策略（不缓存HTML，避免更新问题）
        location ~* \.(js|css)$ {
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
        }
        
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires 0;
        }
    }
    
    # 管理后台API
    location /api/ {
        proxy_pass http://admin_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
}

server {
    if ($host = api.xingshuzhice.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name  api.xingshuzhice.com;
    listen 80;
    return 404; # managed by Certbot

}