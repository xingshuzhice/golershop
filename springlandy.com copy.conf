upstream shopping_api {
    server 127.0.0.1:8000;
    keepalive 64;
}

# HTTP 服务器配置 - 自动跳转到 HTTPS
server {
    listen 80;
    server_name www.springlandy.com;
    return 301 https://$server_name$request_uri;
}

# HTTPS 服务器配置
server { #listening port
    listen 443 ssl http2;
    server_name www.springlandy.com; #Your domain server_name
    client_max_body_size 20M; # 允许大文件上传（商品图片等）

    # SSL 证书配置 (需要替换为实际证书路径)
    ssl_certificate /etc/letsencrypt/live/www.springlandy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.springlandy.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5; 

    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_comp_level 2;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/x-httpd-php image/jpeg image/gif image/png application/wasm;
    gzip_vary off;
    gzip_disable "MSIE [1-6]\.";

    default_type application/wasm;

    autoindex off;

    # ==================== 页面路由配置 ====================
    
    # 管理后台静态页面
    location /admin/ {
        # # IP白名单限制（管理后台只允许内网访问）
        # allow 192.168.1.0/24;
        # allow 10.0.0.0/8;
        # allow 127.0.0.1;
        # deny all;

        alias /home/zerone/code/shop/shopsuite-admin/admin/;  # 管理后台静态文件目录
        index index.html;
        try_files $uri /admin/index.html;
        autoindex off;  # 禁止目录索引显示

        # # 管理后台静态资源缓存
        # location ~* \.(js|css|html)$ {
        #     expires 1h;
        #     add_header Cache-Control "public, must-revalidate";
        # }
    }

    # H5移动端页面
    location /h5/ {
        alias /home/zerone/code/shop/shopsuite-mobile/unpackage/dist/build/web/;  # H5移动端静态文件目录
        index index.html;
        try_files $uri $uri/ /h5/index.html;
        
        # # H5页面缓存设置
        # location ~* \.(js|css|html)$ {
        #     expires 1h;
        #     add_header Cache-Control "public";
        # }
        
        # H5页面特有的移动端优化
        add_header Vary "User-Agent";
    }

 
    # 默认页面重定向到H5（浏览器直接访问根路径时）
    location = / {
        # PC端访问也使用H5页面（H5页面响应式设计，PC端也可正常使用）
        return 302 /h5/;
    }
 

    location / {
        autoindex off;
        proxy_redirect off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_set_header X-NginX-Proxy true;

        # WebSocket支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_http_version 1.1;
        proxy_cache_bypass $http_upgrade;

        # 增加超时时间以支持长连接
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        proxy_pass http://shopping_api;
    }

    # # PC端主商城页面
    # location / {
    #     root /var/www/pc; # PC端前端构建文件目录
    #     index index.html;
    #     try_files $uri $uri/ /index.html;
        
    #     # PC端静态文件缓存设置
    #     location ~* \.(js|css|html)$ {
    #         expires 1h;
    #         add_header Cache-Control "public";
    #     }
    # }

    # # 移动设备自动重定向到H5页面
